[package]
name = "observational-memory"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/sentiolabs/observational-memory"
license = "MIT"
description = "Evidence-backed memory for coding agents, with a CLI and client adapters"

[[bin]]
name = "observational-memory"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
