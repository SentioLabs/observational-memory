name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --check
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match Cargo.toml version'
          PY
      - name: Build release
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          OM_TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          om_archive="observational-memory-${GITHUB_REF_NAME#v}-${OM_TARGET}.tar.gz"
          tar -czf "dist/$om_archive" -C "target/$OM_TARGET/release" observational-memory -C "$GITHUB_WORKSPACE" LICENSE
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Observational Memory $GITHUB_REF_NAME"
