version: '3'
tasks:
  default:
    cmds:
      - go test ./...
      - go test -race ./...
      - go vet ./...
  build:
    cmds:
      - go build -o om ./cmd/om
  release:
    desc: Build and publish a tagged release with GoReleaser
    cmds:
      - goreleaser release --clean
  release:snapshot:
    desc: Build release artifacts locally without publishing
    cmds:
      - goreleaser release --snapshot --clean
  release:check:
    desc: Validate GoReleaser configuration
    cmds:
      - goreleaser check
